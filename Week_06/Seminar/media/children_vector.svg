<svg xmlns="http://www.w3.org/2000/svg" width="580" height="400" viewBox="0 0 580 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="580" height="400" fill="#fafafa"/>

  <!-- parent -> child -->
  <g stroke="#000" stroke-width="3" marker-end="url(#arrow)">
    <line x1="178.6" y1="73.8" x2="130.7" y2="127.0"/>
    <line x1="221.4" y1="73.8" x2="269.3" y2="127.0"/>
    <line x1="95.7" y1="178.6" x2="73.9" y2="222.3"/>
    <line x1="124.3" y1="178.6" x2="146.1" y2="222.3"/>
    <line x1="290" y1="182" x2="290" y2="219"/>
    <line x1="290" y1="282" x2="290" y2="319"/>
  </g>

  <g fill="#fff" stroke="#000" stroke-width="5">
    <circle cx="200" cy="50" r="26"/>
    <circle cx="110" cy="150" r="26"/>
    <circle cx="290" cy="150" r="26"/>
    <circle cx="60" cy="250" r="26"/>
    <circle cx="160" cy="250" r="26"/>
    <circle cx="290" cy="250" r="26"/>
    <circle cx="290" cy="350" r="26"/>
  </g>
  <g font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="200" y="50">0</text>
    <text x="110" y="150">1</text>
    <text x="290" y="150">2</text>
    <text x="60" y="250">3</text>
    <text x="160" y="250">4</text>
    <text x="290" y="250">5</text>
    <text x="290" y="350">6</text>
  </g>

  <!-- vector of children -->
  <g font-size="17" font-family="Consolas, 'Courier New', monospace" dominant-baseline="central">
    <text x="380" y="80"><tspan fill="#c0392b">tree[0]</tspan> = {1, 2}</text>
    <text x="380" y="120"><tspan fill="#c0392b">tree[1]</tspan> = {3, 4}</text>
    <text x="380" y="160"><tspan fill="#c0392b">tree[2]</tspan> = {5}</text>
    <text x="380" y="200"><tspan fill="#c0392b">tree[3]</tspan> = <tspan fill="#999">{}</tspan></text>
    <text x="380" y="240"><tspan fill="#c0392b">tree[4]</tspan> = <tspan fill="#999">{}</tspan></text>
    <text x="380" y="280"><tspan fill="#c0392b">tree[5]</tspan> = {6}</text>
    <text x="380" y="320"><tspan fill="#c0392b">tree[6]</tspan> = <tspan fill="#999">{}</tspan></text>
  </g>
</svg>
