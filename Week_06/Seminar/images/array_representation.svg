<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaa"/>
    </marker>
  </defs>
  <rect width="500" height="400" fill="#fafafa"/>

  <!-- edges -->
  <g stroke="#000" stroke-width="3" marker-end="url(#arrow)">
    <line x1="227.4" y1="82.6" x2="161.9" y2="148.1"/>
    <line x1="272.6" y1="82.6" x2="338.1" y2="148.1"/>
    <line x1="154.3" y1="198.6" x2="181.1" y2="252.3"/>
    <line x1="374.3" y1="198.6" x2="401.1" y2="252.3"/>
  </g>
  <g stroke="#aaa" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow-gray)">
    <line x1="125.7" y1="198.6" x2="98.9" y2="252.3"/>
    <line x1="345.7" y1="198.6" x2="318.9" y2="252.3"/>
  </g>

  <!-- nodes -->
  <g fill="#fff" stroke="#000" stroke-width="5">
    <circle cx="250" cy="60" r="26"/>
    <circle cx="140" cy="170" r="26"/>
    <circle cx="360" cy="170" r="26"/>
    <circle cx="195" cy="280" r="26"/>
    <circle cx="415" cy="280" r="26"/>
  </g>
  <g fill="#fafafa" stroke="#aaa" stroke-width="3" stroke-dasharray="6 5">
    <circle cx="85" cy="280" r="26"/>
    <circle cx="305" cy="280" r="26"/>
  </g>

  <g font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="250" y="60">1</text>
    <text x="140" y="170">2</text>
    <text x="360" y="170">3</text>
    <text x="195" y="280">5</text>
    <text x="415" y="280">4</text>
  </g>
  <g font-size="14" fill="#999" text-anchor="middle" dominant-baseline="central">
    <text x="85" y="280">null</text>
    <text x="305" y="280">null</text>
  </g>

  <!-- array indices -->
  <g font-size="15" fill="#c0392b" dominant-baseline="central">
    <text x="282" y="36">[0]</text>
    <text x="172" y="146">[1]</text>
    <text x="392" y="146">[2]</text>
    <text x="117" y="256">[3]</text>
    <text x="227" y="256">[4]</text>
    <text x="337" y="256">[5]</text>
    <text x="447" y="256">[6]</text>
  </g>

  <!-- array -->
  <g font-size="18" text-anchor="middle" dominant-baseline="central">
    <g fill="#fff" stroke="#000" stroke-width="2">
      <rect x="75" y="335" width="50" height="40"/>
      <rect x="125" y="335" width="50" height="40"/>
      <rect x="175" y="335" width="50" height="40"/>
      <rect x="225" y="335" width="50" height="40"/>
      <rect x="275" y="335" width="50" height="40"/>
      <rect x="325" y="335" width="50" height="40"/>
      <rect x="375" y="335" width="50" height="40"/>
    </g>
    <g font-weight="bold">
      <text x="100" y="355">1</text>
      <text x="150" y="355">2</text>
      <text x="200" y="355">3</text>
      <text x="300" y="355">5</text>
      <text x="400" y="355">4</text>
    </g>
    <g font-size="14" fill="#999">
      <text x="250" y="355">null</text>
      <text x="350" y="355">null</text>
    </g>
    <g font-size="13" fill="#c0392b">
      <text x="100" y="390">0</text>
      <text x="150" y="390">1</text>
      <text x="200" y="390">2</text>
      <text x="250" y="390">3</text>
      <text x="300" y="390">4</text>
      <text x="350" y="390">5</text>
      <text x="400" y="390">6</text>
    </g>
  </g>
</svg>
